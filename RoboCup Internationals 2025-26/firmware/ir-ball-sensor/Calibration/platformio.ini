; Calibration / test sketch - live Serial-Plotter readout of all 16 IR channels.
;
; ARDUINO IDE:  open Calibration.ino (folder name must match the .ino).
;   Install Teensyduino, then Tools > Board > Teensy 4.1, USB Type "Serial".
;   Open Tools > Serial Plotter (or Serial Monitor) at 115200.
;
; PlatformIO:   this same flat sketch also builds with the config below.
[platformio]
src_dir = .

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.ino> +<*.cpp> +<*.c>
