; Defender_Full - Main Teensy 4.1 goalkeeper, WITH the Line PCB (Serial8).
;
; ARDUINO IDE (primary): open Defender_Full.ino (folder name matches the .ino).
;   Install Teensyduino, then Tools > Board > Teensy 4.1, USB Type "Serial".
;   Arduino auto-compiles config.h in this folder. Install via Library Manager:
;     Adafruit BNO055, Adafruit Unified Sensor
;   (and, only if you set USE_OLED 1: Adafruit SSD1306, Adafruit GFX Library)
;
; NOTE: the Line PCB firmware is not written yet. linePoll() in the .ino is the
;   8-byte CRC frame contract the Line Teensy must emit on Serial8 @115200.
;
; PlatformIO (secondary): this same flat sketch also builds with the config below.
[platformio]
src_dir = .

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.ino> +<*.cpp> +<*.c>
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
    ; Uncomment the next two ONLY if you build with USE_OLED 1 in config.h:
    ; adafruit/Adafruit SSD1306
    ; adafruit/Adafruit GFX Library
