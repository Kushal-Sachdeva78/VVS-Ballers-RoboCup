<text x="770" y="360" font-size="14" font-weight="700" fill="#1F2937" text-anchor="middle">Bearing</text>
<text x="770" y="392" font-size="15" font-weight="700" fill="#9A6A1E" text-anchor="middle">= atan2( Σ w·sinθ ,</text>
<text x="770" y="416" font-size="15" font-weight="700" fill="#9A6A1E" text-anchor="middle">Σ w·cosθ )</text>
<text x="770" y="438" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">over all lit sensors</text>
