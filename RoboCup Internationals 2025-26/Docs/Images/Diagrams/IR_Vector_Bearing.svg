<text x="658" y="508" font-size="15" font-weight="700" fill="#1F2937" text-anchor="start">Smoothing &amp; output</text>
<text x="658" y="533" font-size="13" font-weight="400" fill="#475569" text-anchor="start">· hysteresis 60 / 35</text>
<text x="658" y="555" font-size="13" font-weight="400" fill="#475569" text-anchor="start">· EWMA filtered bearing</text>
<text x="658" y="577" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">· sends  dir a  dist b  (500 = no ball)</text>
<text x="400" y="635" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">intensity-weighted contribution vectors (length ∝ signal strength)</text>
