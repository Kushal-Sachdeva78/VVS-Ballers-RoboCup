<text x="658" y="232" font-size="13" font-weight="400" fill="#475569" text-anchor="start">(ambient rejected, lone</text>
<text x="658" y="250" font-size="13" font-weight="400" fill="#475569" text-anchor="start">spikes damped)</text>
