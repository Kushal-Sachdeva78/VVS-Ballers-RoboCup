; Ultrasonic wall/obstacle ranging board - Arduino Nano Every (ATmega4809).
;
; ARDUINO IDE:  open Ultrasonic_NanoEvery.ino (the folder name matches the .ino).
;   Boards Manager > install "Arduino megaAVR Boards".
;   Tools > Board > Arduino megaAVR Boards > Arduino Nano Every.
;   Tools > Registers emulation > "None (ATMEGA4809)"  (fastest; recommended).
;   The IDE auto-compiles config.h in this folder. Upload over USB.
;   Serial Monitor @115200 shows the human-readable debug stream (USB Serial).
;
; PlatformIO:   this same flat sketch builds with the config below.
[platformio]
src_dir = .

[env:nano_every]
platform = atmelmegaavr
board = nano_every
framework = arduino
board_build.f_cpu = 16000000L
monitor_speed = 115200
build_src_filter = +<*.ino> +<*.cpp> +<*.c>
