; Code #2 - Refined IR ball detection for Teensy 4.1 + 2026 ir-golf-ball
;
; ARDUINO IDE:  open Code2_Refined.ino (folder name must match the .ino).
;   Install Teensyduino, then Tools > Board > Teensy 4.1, USB Type "Serial".
;   Arduino auto-compiles config.h / IRSensor.h / IRSensor.cpp in this folder.
;
; PlatformIO:   this same flat sketch also builds with the config below.
[platformio]
src_dir = .

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.ino> +<*.cpp> +<*.c>

; ---------------------------------------------------------------------------
; OPTIONAL dual-ADC acquisition (path (i), faster):
;   The default build uses analogRead() + analogReadAveraging() - NO external
;   library, always compiles. To convert two pins at once with ADC0/ADC1,
;   uncomment the next two lines and guard the code with #ifdef USE_ADC_LIB
;   (see the IRSensor.cpp header comment). In the Arduino IDE you would instead
;   install the "ADC" library (Pedvide) via Library Manager and add
;   #define USE_ADC_LIB at the top of the sketch.
; lib_deps = pedvide/ADC
; build_flags = -D USE_ADC_LIB
