; Attacker MAIN control board - Teensy 4.1.
; IR chase + ultrasonic avoid + OpenMV goal-camera aim-corner + solenoid kick,
; with BNO055 heading-hold. Mirrors the IR-PCB build env (env teensy41).
;
; ARDUINO IDE:  open attacker_chase_aim_kick.ino (folder name must match the .ino).
;   Install Teensyduino, then Tools > Board > Teensy 4.1, USB Type "Serial".
;   Install (Library Manager): "Adafruit BNO055" + "Adafruit Unified Sensor".
;
; PlatformIO:   pio run -e teensy41    (pulls the lib_deps below automatically)
[platformio]
src_dir = .

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = +<*.ino> +<*.cpp> +<*.c>
lib_deps =
    adafruit/Adafruit BNO055
    adafruit/Adafruit Unified Sensor
